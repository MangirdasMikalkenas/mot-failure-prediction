[project]
name = "mot"
version = "0.1.0"
requires-python = ">=3.12.3, <3.13"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.0",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mot"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "test"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort (import sorting)
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "NPY",      # numpy-specific
]

[tool.ruff.lint.isort]
known-first-party = ["mot"]

[tool.ruff.format]
docstring-code-format = true
